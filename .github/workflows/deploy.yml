name: Deploy

# Deploys kindlingcontrol.app (landing page, user guide, presets hub + API) to
# Cloudflare Workers on every push to main. Without the CLOUDFLARE_API_TOKEN
# secret it only tests and builds. Setup (D1 database, email, secrets): docs/PRESETS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Check files shared with the app
        run: node tools/check-vendor.js
      - name: Build
        run: node tools/build.js
      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.151.3 d1 migrations apply kindling-presets --remote
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.151.3 deploy
      - name: Note skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; tested and built the website but skipped the Cloudflare deploy."
